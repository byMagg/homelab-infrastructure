apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k3s-backup
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:byMagg/homelab-infrastructure.git
    targetRevision: main
    path: kubernetes/apps/k3s-backup
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
