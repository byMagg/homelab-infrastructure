apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observatory
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:byMagg/homelab-infrastructure.git
    targetRevision: main
    path: kubernetes/apps/observatory
  destination:
    server: https://kubernetes.default.svc
    namespace: observatory
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
