apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: radar
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:byMagg/homelab-infrastructure.git
    targetRevision: main
    path: kubernetes/apps/radar
  destination:
    server: https://kubernetes.default.svc
    namespace: radar
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
