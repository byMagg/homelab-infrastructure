apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: observability
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    templates:
      # El topic de ntfy NO está en Git: vive en el SealedSecret `ntfy-topic`,
      # que define la plantilla `ntfy_topic`. Ver docs/fase-5.md.
      - /etc/alertmanager-templates/*.tmpl

    route:
      receiver: ntfy
      group_by: ["alertname", "node"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h

    receivers:
      # ntfy.sh: se publica contra la raíz con un payload JSON propio, porque
      # si se publica en https://ntfy.sh/<topic> ntfy interpreta el cuerpo como
      # texto plano y el mensaje sale como JSON crudo.
      - name: ntfy
        webhook_configs:
          - url: https://ntfy.sh
            send_resolved: true
            max_alerts: 10
            payload:
              topic: '{{ template "ntfy_topic" . }}'
              title: '{{ if eq .Status "firing" }}🔥{{ else }}✅{{ end }} {{ .CommonLabels.alertname }}{{ if ne .Status "firing" }} (resuelta){{ end }}'
              message: '{{ range .Alerts }}{{ .Annotations.summary }}{{ with .Annotations.description }} — {{ . }}{{ end }}{{ "\n" }}{{ end }}'
              click: 'http://alertmanager.homelab.home.arpa'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: observability
  labels:
    app.kubernetes.io/name: alertmanager
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertmanager
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.35.0
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
            - --web.listen-address=:9093
            - --web.external-url=http://alertmanager.homelab.home.arpa
            # Una sola réplica: sin gossip HA.
            - --cluster.listen-address=
          ports:
            - name: http
              containerPort: 9093
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: ntfy-templates
              mountPath: /etc/alertmanager-templates
              readOnly: true
            - name: data
              mountPath: /alertmanager
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: ntfy-templates
          secret:
            secretName: ntfy-topic
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: observability
  labels:
    app.kubernetes.io/name: alertmanager
spec:
  selector:
    app.kubernetes.io/name: alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alertmanager
  namespace: observability
spec:
  ingressClassName: traefik
  rules:
    # Solo LAN, igual que Prometheus: la UI no tiene autenticación.
    - host: alertmanager.homelab.home.arpa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: alertmanager
                port:
                  name: http
