apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: radar
  namespace: radar
spec:
  ingressClassName: traefik
  rules:
    # Público a través del túnel de Cloudflare y protegido por Cloudflare
    # Access (la public hostname y la política viven en el dashboard, no aquí).
    - host: radar.dbarroso.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: radar
                port:
                  name: http
    - host: radar.homelab.home.arpa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: radar
                port:
                  name: http
