apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp
  namespace: headlamp
  labels:
    app.kubernetes.io/name: headlamp
---
# Headlamp es un panel de administración del cluster: para que sea útil
# necesita poder ver y tocar todos los recursos, de ahí cluster-admin.
# Solo se publica en la LAN (Ingress de Traefik, UFW abre 80/443 únicamente
# desde 192.168.1.0/24). Si algún día se expone fuera, esto hay que cambiarlo
# por un ClusterRole de solo lectura.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp
  labels:
    app.kubernetes.io/name: headlamp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: headlamp
    namespace: headlamp
