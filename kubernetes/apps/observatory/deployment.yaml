apiVersion: apps/v1
kind: Deployment
metadata:
  name: observatory
  namespace: observatory
  labels:
    app.kubernetes.io/name: observatory
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: observatory
  template:
    metadata:
      labels:
        app.kubernetes.io/name: observatory
    spec:
      serviceAccountName: observatory
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: observatory
          image: node:26-alpine
          command: ["node", "/app/server.js"]
          env:
            - name: PORT
              value: "8080"
            - name: PROM_URL
              value: "http://prometheus.observability.svc.cluster.local:9090"
            - name: ALERTMANAGER_URL
              value: "http://alertmanager.observability.svc.cluster.local:9093"
            - name: PUBLIC_PROBE_URL
              value: "https://dbarroso.dev/live/healthz"
            - name: BACKUP_SCHEDULE
              value: "03:15"
            - name: HOME
              value: "/tmp"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 96Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: app
          configMap:
            name: observatory-files
        - name: tmp
          emptyDir: {}
