apiVersion: v1
kind: ServiceAccount
metadata:
  name: observatory
  namespace: observatory
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: observatory-reader
rules:
  # Solo lectura de los objetos que se muestran en la página pública.
  # Nunca secrets, logs ni configuración sensible.
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets"]
    verbs: ["get", "list"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: observatory-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: observatory-reader
subjects:
  - kind: ServiceAccount
    name: observatory
    namespace: observatory
