apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observatory
resources:
  - namespace.yaml
  - rbac.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
configMapGenerator:
  - name: observatory-files
    files:
      - server.js
      - web/index.html
      - web/styles.css
      - web/app.js
