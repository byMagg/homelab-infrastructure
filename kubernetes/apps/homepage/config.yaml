apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  settings.yaml: |
    title: Homelab
    theme: dark
    color: slate
    headerStyle: clean
    statusStyle: dot
    layout:
      Cluster:
        style: row
        columns: 3
      Observabilidad:
        style: row
        columns: 3
      Red:
        style: row
        columns: 1
      Demo:
        style: row
        columns: 1
  kubernetes.yaml: |
    mode: cluster
  # Homepage copia estos ficheros desde la imagen si no existen; con el rootfs
  # de solo lectura hay que montarlos todos, aunque estén vacíos.
  docker.yaml: ""
  proxmox.yaml: ""
  widgets.yaml: |
    - greeting:
        text_size: xl
        text: Homelab
    - datetime:
        text_size: xl
        format:
          dateStyle: long
          timeStyle: short
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: cluster
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
  services.yaml: |
    - Cluster:
        - Argo CD:
            icon: argo-cd.png
            href: https://argocd.dbarroso.dev
            description: GitOps y estado de las apps
            siteMonitor: http://argocd-server.argocd.svc.cluster.local
        - Portfolio:
            icon: si-astro
            href: https://dbarroso.dev
            description: CV en Astro servido desde el cluster
            siteMonitor: http://portfolio.portfolio.svc.cluster.local
        - Observatorio:
            icon: si-kubernetes
            href: https://dbarroso.dev/live
            description: Vista pública en vivo de todas las capas
            siteMonitor: http://observatory.observatory.svc.cluster.local/healthz
        - Radar:
            icon: https://raw.githubusercontent.com/skyhook-io/radar/main/radar-icon.svg
            href: https://radar.dbarroso.dev
            description: "Qué está roto y por qué: issues, topología y timeline"
            siteMonitor: http://radar.radar.svc.cluster.local:9280/api/health

    - Observabilidad:
        - Grafana:
            icon: grafana.png
            href: https://grafana.dbarroso.dev
            description: Dashboards del cluster
            siteMonitor: http://grafana.observability.svc.cluster.local:3000/api/health
        - Prometheus:
            icon: prometheus.png
            href: http://prometheus.homelab.home.arpa
            description: Métricas y consultas PromQL (solo LAN)
            siteMonitor: http://prometheus.observability.svc.cluster.local:9090/-/healthy
        - Alertmanager:
            icon: prometheus.png
            href: http://alertmanager.homelab.home.arpa
            description: Alertas agrupadas (solo LAN)
            siteMonitor: http://alertmanager.observability.svc.cluster.local:9093/-/ready

    - Red:
        - AdGuard Home:
            icon: adguard-home.png
            href: http://adguard.homelab.home.arpa
            description: DNS y bloqueo de anuncios
            siteMonitor: http://adguard-web.adguard.svc.cluster.local

  bookmarks.yaml: |
    - Proyecto:
        - Repositorio en GitHub:
            - abbr: GH
              href: https://github.com/byMagg/homelab-infrastructure
    - Documentación:
        - Homepage:
            - abbr: HP
              href: https://gethomepage.dev/
        - Argo CD:
            - abbr: AC
              href: https://argo-cd.readthedocs.io/
  custom.js: ""
  custom.css: ""
