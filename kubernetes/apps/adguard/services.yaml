apiVersion: v1
kind: Service
metadata:
  name: adguard-dns
  namespace: adguard
  labels:
    app.kubernetes.io/name: adguard
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: adguard
  ports:
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: adguard-web
  namespace: adguard
  labels:
    app.kubernetes.io/name: adguard
spec:
  selector:
    app.kubernetes.io/name: adguard
  ports:
    - name: http
      port: 3000
      targetPort: web
