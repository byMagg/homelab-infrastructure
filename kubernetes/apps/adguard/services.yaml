apiVersion: v1
kind: Service
metadata:
  name: adguard-dns
  namespace: adguard
  labels:
    app.kubernetes.io/name: adguard
spec:
  type: LoadBalancer
  # Conserva la IP de origen: sin esto kube-proxy hace SNAT y AdGuard ve
  # todas las consultas como 10.42.0.1 (sin estadísticas por cliente).
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: adguard
  ports:
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: adguard-web
  namespace: adguard
  labels:
    app.kubernetes.io/name: adguard
spec:
  selector:
    app.kubernetes.io/name: adguard
  ports:
    - name: http
      port: 80
      targetPort: web
