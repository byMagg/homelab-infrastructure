name: portfolio-tag

# Lo dispara el repo que construye la imagen (dbarrosourr.github.io) al
# terminar el build, o una persona a mano desde la pestaña Actions.
on:
  repository_dispatch:
    types: [portfolio-image]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag publicado (sha-<commit>)"
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: portfolio-tag
  cancel-in-progress: true

jobs:
  update:
    name: Aplicar el tag recibido
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # El valor llega por env (no interpolado en el shell) y se valida antes
      # de tocar nada: un dispatch solo lo puede enviar quien tenga el token.
      - name: Validar el tag
        id: tag
        env:
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          tag="${DISPATCH_TAG:-$INPUT_TAG}"
          if ! printf '%s' "$tag" | grep -Eqx 'sha-[0-9a-f]{7,40}'; then
            echo "Tag inválido: '$tag'" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Actualizar el Deployment
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: python3 scripts/set-portfolio-tag.py "$TAG"

      - name: Abrir PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/portfolio-tag
          delete-branch: true
          commit-message: "chore(portfolio): actualizar imagen a ${{ steps.tag.outputs.tag }}"
          title: "chore(portfolio): actualizar imagen a ${{ steps.tag.outputs.tag }}"
          body: |
            Imagen publicada por `dbarrosourr/dbarrosourr.github.io`.

            Tag: `${{ steps.tag.outputs.tag }}`

            Al mergear, Argo CD despliega la imagen. El paquete de GHCR debe
            seguir siendo público para que el kubelet pueda hacer pull.
