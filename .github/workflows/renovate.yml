name: renovate

on:
  schedule:
    # Lunes 04:00 UTC (05:00 en invierno, 06:00 en verano en Madrid).
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Renovate
        uses: renovatebot/github-action@v46.3.15
        with:
          configurationFile: renovate.json
          # Si existe RENOVATE_TOKEN se usa; si no, el GITHUB_TOKEN del job.
          # Con GITHUB_TOKEN hay que activar en el repo:
          # Settings -> Actions -> General -> Allow GitHub Actions to create
          # and approve pull requests.
          token: ${{ secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          LOG_LEVEL: info
