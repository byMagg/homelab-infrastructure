---
all:
  children:
    raspberry:
      children:
        k3s_servers:
          hosts:
            cluster0:
              ansible_host: "{{ lookup('env', 'CLUSTER0_HOST') | default('cluster0.local', true) }}"
              ansible_user: "{{ lookup('env', 'CLUSTER0_USER') | default('CHANGE_ME', true) }}"
        k3s_agents:
          hosts:
            cluster1:
              ansible_host: "{{ lookup('env', 'CLUSTER1_HOST') | default('cluster1.local', true) }}"
              ansible_user: "{{ lookup('env', 'CLUSTER1_USER') | default('admin', true) }}"
    dns_nodes:
      hosts:
        cluster1:
