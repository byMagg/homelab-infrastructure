---
# Dominio interno (RFC 8375). Se puede cambiar sin tocar el resto del cluster.
internal_domain: homelab.home.arpa

# Red del homelab
lan_cidr: 192.168.1.0/24
lan_gateway: 192.168.1.1
k3s_api_port: 6443

# Versión fijada de k3s (Kubernetes 1.37.2)
k3s_version: v1.37.2+k3s1

# Rangos internos de Kubernetes
cluster_cidr: 10.42.0.0/16
service_cidr: 10.43.0.0/16

# Swap/zram: desactivado para kubelet
disable_swap: true

# --- Fase 7: backups -------------------------------------------------------
# cluster0 usa SQLite/kine, NO etcd: `k3s etcd-snapshot` no sirve aquí. El
# backup es una copia consistente de state.db + token + tls/cred/manifests
# (ver docs/fase-7.md). Timer diario a las 03:15 (RPO 24 h).
k3s_backup_schedule: "*-*-* 03:15:00"
k3s_backup_local_retention: 4  # 4 días en /var/backups/k3s
k3s_backup_r2_secret: "r2-backup"  # Secret en kube-system (SealedSecret)
k3s_backup_r2_retention_days: 14
