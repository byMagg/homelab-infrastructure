---
# Bootstrap de un nodo recién instalado: crea el usuario `ansible` con la
# clave del portátil y sudo sin contraseña. Se ejecuta como el usuario que
# creó Raspberry Pi Imager (`admin`), que sí pide contraseña:
#
#   ansible-playbook ansible/playbooks/bootstrap.yml \
#     -e ansible_user=admin --ask-pass --ask-become-pass --limit cluster0
#
- name: Bootstrap - usuario ansible
  hosts: k3s_cluster
  become: true
  gather_facts: true
  vars:
    bootstrap_pubkey: "{{ lookup('file', lookup('env', 'HOME') ~ '/.ssh/id_ed25519.pub') | trim }}"
  tasks:
    - name: Crear usuario ansible
      ansible.builtin.user:
        name: ansible
        shell: /bin/bash
        create_home: true
        groups: sudo
        append: true

    - name: Crear ~/.ssh
      ansible.builtin.file:
        path: /home/ansible/.ssh
        state: directory
        owner: ansible
        group: ansible
        mode: "0700"

    # Se usa lineinfile y no authorized_key porque este último vive en la
    # colección ansible.posix, que no está instalada: el bootstrap tiene que
    # funcionar en un portátil recién formateado con lo mínimo.
    - name: Instalar clave pública del portátil
      ansible.builtin.lineinfile:
        path: /home/ansible/.ssh/authorized_keys
        line: "{{ bootstrap_pubkey }}"
        create: true
        owner: ansible
        group: ansible
        mode: "0600"

    - name: Permitir sudo sin contraseña
      ansible.builtin.copy:
        dest: /etc/sudoers.d/ansible
        content: "ansible ALL=(ALL) NOPASSWD:ALL\n"
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s
