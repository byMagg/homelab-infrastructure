---
- name: Comprobar controlador memory de cgroups
  ansible.builtin.command:
    cmd: grep -qw memory /sys/fs/cgroup/cgroup.controllers
  changed_when: false
  tags: [verify]

- name: Leer swaps activos
  ansible.builtin.command:
    cmd: cat /proc/swaps
  register: verify_swaps
  changed_when: false
  tags: [verify]

- name: Verificar ausencia de swap
  ansible.builtin.assert:
    that:
      - verify_swaps.stdout_lines | length == 1
  tags: [verify]

- name: Leer configuración efectiva de sshd
  ansible.builtin.command:
    cmd: sshd -T
  register: verify_sshd
  changed_when: false
  tags: [verify]

- name: Verificar hardening de SSH
  ansible.builtin.assert:
    that:
      - "'passwordauthentication no' in verify_sshd.stdout"
      - "'permitrootlogin no' in verify_sshd.stdout"
      - "'allowusers ansible' in verify_sshd.stdout"
      - "'allowusers admin' in verify_sshd.stdout"
  tags: [verify]

- name: Estado de UFW
  ansible.builtin.command:
    cmd: ufw status verbose
  register: verify_ufw
  changed_when: false
  tags: [verify]

- name: Estado de servicios  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: systemctl is-active {{ item }}
  loop:
    - ssh
    - ufw
    - fail2ban
    - systemd-timesyncd
  register: verify_services
  changed_when: false
  tags: [verify]

- name: Comprobar watchdog
  ansible.builtin.stat:
    path: /dev/watchdog
  register: verify_watchdog
  tags: [verify]

- name: Comprobar throttling
  ansible.builtin.command:
    cmd: vcgencmd get_throttled
  register: verify_throttled
  changed_when: false
  tags: [verify]

# --- Fase 7: backups -------------------------------------------------------
- name: Comprobar el timer de backup de k3s  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: systemctl is-active k3s-backup.timer
  register: verify_backup_timer
  changed_when: false
  failed_when: false
  when: inventory_hostname in groups['k3s_server']
  tags: [verify]

- name: Verificar que el timer está activo
  ansible.builtin.assert:
    that:
      - verify_backup_timer.stdout == 'active'
    fail_msg: k3s-backup.timer no está activo; aplica ansible/playbooks/phase7.yml
  when: inventory_hostname in groups['k3s_server']
  tags: [verify]

- name: Buscar backups locales recientes
  ansible.builtin.find:
    paths: /var/backups/k3s
    patterns: "k3s-state-*.tar.gz"
    age: "-12h"
  register: verify_backups
  when: inventory_hostname in groups['k3s_server']
  tags: [verify]

- name: Verificar que hay un backup de las últimas 12 h
  ansible.builtin.assert:
    that:
      - verify_backups.matched | int > 0
    fail_msg: No hay ningún backup de k3s de las últimas 12 h
  when: inventory_hostname in groups['k3s_server']
  tags: [verify]

- name: Comprobar si existe el Secret de R2
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - -n
      - kube-system
      - get
      - secret
      - "{{ k3s_backup_r2_secret }}"
  register: verify_backup_r2_secret
  changed_when: false
  failed_when: false
  when: inventory_hostname in groups['k3s_server']
  tags: [verify]

- name: Mostrar resumen
  ansible.builtin.debug:
    msg:
      - "hostname: {{ inventory_hostname }}"
      - "lineas_swap: {{ verify_swaps.stdout_lines | length }}"
      - "ufw: {{ verify_ufw.stdout_lines[0] | default('sin salida') }}"
      - "servicios: {{ verify_services.results | map(attribute='stdout') | list }}"
      - "watchdog: {{ verify_watchdog.stat.exists }}"
      - "throttled: {{ verify_throttled.stdout }}"
      - "backup_timer: {{ verify_backup_timer.stdout | default('no aplica') }}"
      - "backups_12h: {{ verify_backups.matched | default('no aplica') }}"
      - "r2_configurado: {{ 'no aplica' if inventory_hostname not in groups['k3s_server'] else ((verify_backup_r2_secret.rc | default(1)) == 0) }}"
  tags: [verify]
