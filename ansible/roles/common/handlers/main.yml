---
- name: restart sshd
  ansible.builtin.systemd:
    name: ssh
    state: restarted

- name: restart journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted

- name: apply sysctl
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: false

- name: restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted
