---
- name: Reiniciar sshd
  ansible.builtin.systemd:
    name: ssh
    state: restarted

- name: Reiniciar journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted

- name: Aplicar sysctl
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: false

- name: Reiniciar fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted
