---
- name: Comprobar plataforma soportada
  ansible.builtin.assert:
    that:
      - ansible_architecture == 'aarch64'
      - ansible_distribution == 'Debian'
      - ansible_distribution_major_version == '13'
    fail_msg: "Se espera Raspberry Pi OS Trixie 64-bit (Debian 13, aarch64)."
  tags: [base]

- name: Configurar hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
  tags: [base]

- name: Añadir nodos a /etc/hosts
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE HOMELAB"
    block: |
      192.168.1.100 cluster0
      192.168.1.101 cluster1
      192.168.1.102 cluster2
  tags: [base]

- name: Actualizar cache de apt
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  tags: [base]

- name: Actualizar paquetes instalados
  ansible.builtin.apt:
    upgrade: safe
  tags: [base]

- name: Instalar paquetes base
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - jq
      - htop
      - iotop
      - iftop
      - vim
      - tmux
      - rsync
      - rclone
      - ufw
      - fail2ban
      - python3-systemd
      - unattended-upgrades
      - apt-listchanges
      - logrotate
      - mmc-utils
      - sysstat
      - nftables
    state: present
  tags: [base]

- name: Configurar zona horaria
  ansible.builtin.command:
    cmd: timedatectl set-timezone Europe/Madrid
  changed_when: false
  tags: [base]

- name: Asegurar sincronización horaria
  ansible.builtin.systemd:
    name: systemd-timesyncd
    enabled: true
    state: started
  tags: [base]

# --- Mitigación de desgaste de SD ---

- name: Crear directorio de drop-ins de journald
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"
  tags: [sd]

- name: Configurar journald en memoria
  ansible.builtin.template:
    src: journald.conf.j2
    dest: /etc/systemd/journald.conf.d/99-homelab.conf
    mode: "0644"
  notify: restart journald
  tags: [sd]

- name: Crear directorio de drop-ins de coredump
  ansible.builtin.file:
    path: /etc/systemd/coredump.conf.d
    state: directory
    mode: "0755"
  tags: [sd]

- name: Desactivar coredumps en disco
  ansible.builtin.template:
    src: coredump.conf.j2
    dest: /etc/systemd/coredump.conf.d/99-homelab.conf
    mode: "0644"
  tags: [sd]

# --- Módulos y parámetros del kernel ---

- name: Configurar módulos del kernel
  ansible.builtin.template:
    src: modules-k3s.conf.j2
    dest: /etc/modules-load.d/k3s.conf
    mode: "0644"
  tags: [sysctl]

- name: Cargar br_netfilter
  ansible.builtin.modprobe:
    name: br_netfilter
    state: present
  tags: [sysctl]

- name: Cargar overlay
  ansible.builtin.modprobe:
    name: overlay
    state: present
  tags: [sysctl]

- name: Configurar parámetros del kernel
  ansible.builtin.template:
    src: sysctl-homelab.conf.j2
    dest: /etc/sysctl.d/99-homelab.conf
    mode: "0644"
  notify: apply sysctl
  tags: [sysctl]

# --- SSH ---

- name: Eliminar drop-in antiguo de sshd
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/99-homelab.conf
    state: absent
  tags: [ssh]

- name: Hardening de sshd
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-homelab.conf
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: restart sshd
  tags: [ssh]

# --- Firewall ---

- name: Política por defecto de entrada
  community.general.ufw:
    default: deny
    direction: incoming
  tags: [firewall]

- name: Política por defecto de salida
  community.general.ufw:
    default: allow
    direction: outgoing
  tags: [firewall]

- name: Permitir tráfico enrutado (pods)
  community.general.ufw:
    default: allow
    direction: routed
  tags: [firewall]

- name: Permitir puertos TCP desde la LAN
  community.general.ufw:
    rule: allow
    direction: in
    proto: tcp
    port: "{{ item }}"
    from_ip: "{{ lan_cidr }}"
  loop:
    - "22"
    - "53"
    - "80"
    - "443"
    - "4240"
    - "4244"
    - "6443"
    - "9100"
    - "10250"
  tags: [firewall]

- name: Permitir puertos UDP desde la LAN
  community.general.ufw:
    rule: allow
    direction: in
    proto: udp
    port: "{{ item }}"
    from_ip: "{{ lan_cidr }}"
  loop:
    - "53"
    - "5353"
    - "8472"
    - "51871"
  tags: [firewall]

# Prometheus corre en la red de pods y scrapea el kubelet (10250) y
# node-exporter (9100) en la IP de cada nodo.
- name: Permitir métricas de nodo desde la red de pods
  community.general.ufw:
    rule: allow
    direction: in
    proto: tcp
    port: "{{ item.port }}"
    from_ip: "{{ item.cidr }}"
  loop:
    - { port: "9100", cidr: "{{ cluster_cidr }}" }
    - { port: "9100", cidr: "{{ service_cidr }}" }
    - { port: "10250", cidr: "{{ cluster_cidr }}" }
    - { port: "10250", cidr: "{{ service_cidr }}" }
  tags: [firewall]

- name: Activar UFW
  community.general.ufw:
    state: enabled
    logging: low
  tags: [firewall]

# --- fail2ban ---

- name: Configurar jail de sshd
  ansible.builtin.template:
    src: fail2ban-sshd.local.j2
    dest: /etc/fail2ban/jail.d/sshd.local
    mode: "0644"
  notify: restart fail2ban
  tags: [fail2ban]

- name: Habilitar fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started
  tags: [fail2ban]

# --- Actualizaciones automáticas ---

- name: Configurar actualizaciones automáticas
  ansible.builtin.template:
    src: unattended-20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
  tags: [unattended]

- name: Configurar política de unattended-upgrades
  ansible.builtin.template:
    src: unattended-99-homelab.j2
    dest: /etc/apt/apt.conf.d/99-homelab
    mode: "0644"
  tags: [unattended]

- name: Habilitar unattended-upgrades
  ansible.builtin.systemd:
    name: unattended-upgrades
    enabled: true
  tags: [unattended]
