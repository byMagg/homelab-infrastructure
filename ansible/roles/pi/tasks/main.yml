---
# --- cgroups: el firmware inyecta cgroup_disable=memory ---

- name: Añadir cgroup_enable=memory a cmdline.txt
  ansible.builtin.lineinfile:
    path: /boot/firmware/cmdline.txt
    regexp: '^(?!.*cgroup_enable=memory)(.*)$'
    line: '\1 cgroup_enable=memory'
    backrefs: true
  tags: [pi]

- name: Añadir cgroup_memory=1 a cmdline.txt
  ansible.builtin.lineinfile:
    path: /boot/firmware/cmdline.txt
    regexp: '^(?!.*cgroup_memory=1)(.*)$'
    line: '\1 cgroup_memory=1'
    backrefs: true
  tags: [pi]

# --- Swap/zram: kubelet no arranca con swap activo ---

- name: Crear drop-in de rpi-swap
  ansible.builtin.file:
    path: /etc/rpi/swap.conf.d
    state: directory
    mode: "0755"
  tags: [pi]

- name: Desactivar swap y zram
  ansible.builtin.copy:
    dest: /etc/rpi/swap.conf.d/90-disable.conf
    content: |
      [Main]
      Mechanism=none
    mode: "0644"
  tags: [pi]

# /boot/firmware es vfat: los permisos los fija el montaje, no Ansible.
- name: Copiar config.txt original (solo la primera vez)  # noqa: risky-file-permissions
  ansible.builtin.copy:
    src: /boot/firmware/config.txt
    dest: /boot/firmware/config.txt.orig
    remote_src: true
    force: false
  tags: [pi]

- name: Ajustar opciones de firmware
  ansible.builtin.lineinfile:
    path: /boot/firmware/config.txt
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - { regexp: '^dtparam=audio=', line: 'dtparam=audio=off' }
    - { regexp: '^dtoverlay=vc4-kms-v3d', line: '#dtoverlay=vc4-kms-v3d' }
    - { regexp: '^gpu_mem=', line: 'gpu_mem=16' }
    - { regexp: '^dtparam=watchdog=', line: 'dtparam=watchdog=on' }
    - { regexp: '^dtoverlay=disable-wifi', line: 'dtoverlay=disable-wifi' }
    - { regexp: '^dtoverlay=disable-bt', line: 'dtoverlay=disable-bt' }
  tags: [pi]

- name: Crear drop-in de systemd
  ansible.builtin.file:
    path: /etc/systemd/system.conf.d
    state: directory
    mode: "0755"
  tags: [pi]

- name: Configurar watchdog de hardware
  ansible.builtin.template:
    src: watchdog.conf.j2
    dest: /etc/systemd/system.conf.d/99-watchdog.conf
    mode: "0644"
  notify: Reejecutar systemd
  tags: [pi]

- name: Comprobar firmware EEPROM
  ansible.builtin.command:
    cmd: rpi-eeprom-update
  register: pi_eeprom
  changed_when: false
  failed_when: false
  tags: [pi]

- name: Aplicar actualización de EEPROM si está disponible
  ansible.builtin.command:
    cmd: rpi-eeprom-update -a
  when: "'UPDATE AVAILABLE' in pi_eeprom.stdout"
  register: pi_eeprom_apply
  changed_when: pi_eeprom_apply.rc == 0
  tags: [pi]

- name: Mostrar estado de EEPROM
  ansible.builtin.debug:
    var: pi_eeprom.stdout_lines
  tags: [pi]
